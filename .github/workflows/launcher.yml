name: Build Visual Launcher

# Builds Windows / macOS / Linux installers and uploads them (plus the newest Visual Client jar)
# to the GitHub release "launcher":
#   https://github.com/<owner>/<repo>/releases/tag/launcher
# Runs on pushes to main, on pull requests (same repository), on "launcher-v*" tags and manually.
on:
  push:
    branches: [main]
    tags: ['launcher-v*']
    paths: ['launcher/**', '.github/workflows/launcher.yml', 'visual-client-*.jar']
  pull_request:
    paths: ['launcher/**', '.github/workflows/launcher.yml', 'visual-client-*.jar']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-14
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installers
        run: npm run dist -- ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: visual-launcher-${{ matrix.os }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.dmg
            launcher/dist/*.AppImage
          if-no-files-found: error

  release:
    # forks get no write token, so only publish for this repository
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    concurrency: launcher-release
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Add newest Visual Client jar
        run: |
          # same version logic as the launcher (numeric, handles 1.13.0 and 1_1_0 names)
          node launcher/scripts/sync-visual-client.js
          jar=$(ls launcher/resources/mods/visual-client-*.jar)
          cp "$jar" artifacts/
          echo "VC_JAR=$(basename "$jar")" >> "$GITHUB_ENV"
          echo "LAUNCHER_VERSION=$(node -p "require('./launcher/package.json').version")" >> "$GITHUB_ENV"

      - name: Remove old build files from the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # only replace files this workflow produces; anything else uploaded by hand is kept
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              grep -E '\.(exe|dmg|AppImage)$|^visual-client-.*\.jar$' |
              while read -r name; do gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" -y; done
          fi

      - name: Upload to release "launcher"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          name: Visual Launcher ${{ env.LAUNCHER_VERSION }}
          make_latest: true
          files: artifacts/*
          body: |
            **Visual Launcher ${{ env.LAUNCHER_VERSION }}** – moderner Minecraft-Launcher mit Microsoft-Login, Modrinth-Bibliothek und eingebautem Visual Client (`${{ env.VC_JAR }}`).

            **Download**
            - Windows: `Visual-Launcher-${{ env.LAUNCHER_VERSION }}-portable.exe` (ohne Installation) oder `Visual.Launcher.Setup.${{ env.LAUNCHER_VERSION }}.exe` (Installer)
            - macOS: `.dmg` (nicht signiert: Rechtsklick → Öffnen)
            - Linux: `.AppImage`
            - Nur die Mod: `${{ env.VC_JAR }}` in den `mods`-Ordner legen (Fabric + Fabric API nötig)

            Windows warnt beim ersten Start, weil die Datei nicht signiert ist: „Weitere Informationen“ → „Trotzdem ausführen“.

            Automatisch gebaut aus Commit ${{ github.event.pull_request.head.sha || github.sha }}.

