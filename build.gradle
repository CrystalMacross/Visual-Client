plugins {
	// 1.21.11 is still obfuscated, so the "remap" flavour of Loom is required.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// The whole project is written against the official Mojang names (GuiGraphics, Identifier, ...).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Lets you run "gradle wrapper" once to generate gradlew / gradlew.bat for this project.
wrapper {
	gradleVersion = '9.2.1'
	distributionType = Wrapper.DistributionType.BIN
}
